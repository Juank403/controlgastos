<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Flux Finance Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 🔥 TU CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAD...",
  authDomain: "gastos-b526f.firebaseapp.com",
  projectId: "gastos-b526f",
  storageBucket: "gastos-b526f.firebasestorage.app",
  messagingSenderId: "181887892967",
  appId: "1:181887892967:web:6487fa2dbbfd4c9317d142"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* =========================
   OFFLINE QUEUE SYSTEM
========================= */

let queue = JSON.parse(localStorage.getItem("queue")) || [];

/* guardar en firebase */
async function pushToCloud(tx){
  try {
    await addDoc(collection(db,"transactions"), tx);
  } catch(e){
    console.log("offline → queued");
    queue.push(tx);
    localStorage.setItem("queue", JSON.stringify(queue));
  }
}

/* sync pendiente */
async function syncQueue(){
  if(!navigator.onLine) return;

  const copy = [...queue];
  queue = [];

  for(const tx of copy){
    try{
      await addDoc(collection(db,"transactions"), tx);
    }catch(e){
      queue.push(tx);
    }
  }

  localStorage.setItem("queue", JSON.stringify(queue));
}

/* realtime sync */
function listenCloud(setData){
  onSnapshot(collection(db,"transactions"), (snap)=>{

    const data = snap.docs.map(d=>d.data());
    setData(data);

  });
}

window.firebaseSync = {
  pushToCloud,
  syncQueue,
  listenCloud
};

</script>

<style>

body{
  margin:0;
  font-family:-apple-system;
  background:#0b0f17;
  color:white;
}

.app{
  max-width:720px;
  margin:auto;
  padding:20px;
}

.card{
  background:rgba(255,255,255,.06);
  padding:16px;
  border-radius:18px;
  margin-bottom:12px;
}

button{
  padding:12px;
  border:none;
  border-radius:12px;
  background:#7c5cff;
  color:white;
}

input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:none;
}

</style>
</head>

<body>

<div class="app">

<h2>Flux Finance 🔥</h2>

<input id="title" placeholder="Título"/>
<input id="amount" type="number" placeholder="Monto"/>

<button onclick="save()">Guardar</button>

<h3>Movimientos</h3>
<div id="list"></div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("data")) || [];

function save(){

  const tx = {
    id: crypto.randomUUID(),
    title: title.value,
    amount: Number(amount.value),
    date: Date.now()
  };

  // 1. LOCAL FIRST
  data.unshift(tx);
  localStorage.setItem("data", JSON.stringify(data));

  render();

  // 2. CLOUD SYNC
  if(window.firebaseSync){
    firebaseSync.pushToCloud(tx);
  }
}

function render(){

  list.innerHTML = "";

  data.forEach(t=>{

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${t.title}</b><br>
      $${t.amount}
    `;

    list.appendChild(div);

  });

}

/* INIT */
render();

/* FIREBASE REALTIME SYNC */
if(window.firebaseSync){

  firebaseSync.listenCloud((cloudData)=>{

    data = cloudData;
    localStorage.setItem("data", JSON.stringify(data));
    render();

  });

  window.addEventListener("online", ()=>{
    firebaseSync.syncQueue();
  });

}

</script>

</body>
</html>
